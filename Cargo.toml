[workspace]
resolver = "2"
members = [
    "crates/vmcp-op-core",
    "crates/vmcp-op-pyo3",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/hewimetall/vmcp_operator"

[workspace.dependencies]
pyo3 = { version = "0.29.0", features = ["abi3t-py315"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
# Pinned to vmcp v1.2.0 (AuthFacade + hop trust + forward_identity).
vmcp-registry = { git = "https://github.com/hewimetall/vmcp", rev = "450f7426477b78b554b2463cb13a5c2268eab000" }
