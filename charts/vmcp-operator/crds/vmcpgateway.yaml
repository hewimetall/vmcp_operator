apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmcpgateways.vmcp.io
  labels:
    app.kubernetes.io/name: vmcp-operator
    app.kubernetes.io/component: crd
spec:
  group: vmcp.io
  names:
    kind: VmcpGateway
    listKind: VmcpGatewayList
    plural: vmcpgateways
    singular: vmcpgateway
    shortNames:
      - vg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Observed
          type: integer
          jsonPath: .status.observedGeneration
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: Independent vmcp gateway instance managed by the operator.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - image
                - adminTokenSecretRef
                - masterPasswordSecretRef
                - publicRoute
              properties:
                image:
                  type: string
                  minLength: 1
                  description: OCI image for this vmcp instance (must match operator allowlist).
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 1
                  default: 1
                adminTokenSecretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      default: token
                    writable:
                      type: boolean
                      default: false
                      description: >
                        When true, seed tokens.json onto the Gateway PVC at
                        /state/tokens.json (copy only if missing) so admin Token
                        CRUD can persist. Default false mounts the Secret
                        read-only at /secrets/tokens.json.
                  description: >
                    Secret with tokens.json body (key default `token`) for
                    bootstrap/admin API access.
                masterPasswordSecretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      default: password
                publicBaseUrl:
                  type: string
                  description: >
                    Override public_base_url in vmcp.toml. Defaults to
                    https://{publicRoute.hostname}.
                publicRoute:
                  type: object
                  required: [hostname, gatewayRef]
                  properties:
                    hostname:
                      type: string
                      minLength: 1
                    gatewayRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        sectionName:
                          type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    stripClientIdentityHeaders:
                      type: boolean
                      default: true
                      description: >
                        Defence in depth: HTTPRoute RequestHeaderModifier removes
                        client-supplied X-authentik-* and X-Vmcp-Forward-Auth on the
                        public edge (issue #4 Gap 1). When the parent Gateway is in
                        the same namespace, the operator also applies a kgateway
                        ListenerPolicy earlyRequestHeaderModifier (before extAuth).
                    manage:
                      type: boolean
                      default: true
                      description: >
                        When false, operator does not render/apply this HTTPRoute
                        (bring-your-own route).
                    extraFilters:
                      type: array
                      description: Extra Gateway API HTTPRouteFilter objects.
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                adminRoute:
                  type: object
                  description: >
                    Optional admin HTTPRoute. Omit hostname to share
                    publicRoute.hostname and expose only `path` (default
                    `/admin`) — same-host admin. A distinct hostname is
                    still supported. Omit gatewayRef to inherit
                    publicRoute.gatewayRef.
                  properties:
                    hostname:
                      type: string
                      description: >
                        Distinct admin hostname. When omitted or empty, uses
                        publicRoute.hostname (path-based admin on the public
                        host).
                    path:
                      type: string
                      default: /admin
                      description: >
                        HTTPRoute PathPrefix for this admin route (Gateway API
                        longest-match vs public `/`).
                    gatewayRef:
                      type: object
                      required: [name]
                      description: >
                        Parent Gateway. When omitted, uses publicRoute.gatewayRef.
                      properties:
                        name:
                          type: string
                          minLength: 1
                        namespace:
                          type: string
                        sectionName:
                          type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    stripClientIdentityHeaders:
                      type: boolean
                      default: true
                      description: >
                        Same identity-header strip as the public route, merged
                        into a single RequestHeaderModifier with hop inject
                        (Gateway API allows one of that type per rule). When
                        injectForwardAuthHeader is also on, Authentik identity
                        headers are *not* removed here: HTTPRoute filters run
                        after kgateway extAuth, so stripping them undoes
                        forward-auth login (issue #8). Pre-auth strip is a
                        same-namespace kgateway ListenerPolicy
                        earlyRequestHeaderModifier (see spec.identityStrip).
                    injectForwardAuthHeader:
                      type: boolean
                      description: >
                        When true (default if auth.authentik.forwardAuthSecretRef is
                        set), admin HTTPRoute sets the hop header from that Secret
                        so browser /admin passes hop trust after Authentik
                        forward-auth (issue #4 Gap 2).
                    manage:
                      type: boolean
                      default: true
                      description: >
                        When false, operator does not render/apply the admin HTTPRoute.
                    extraFilters:
                      type: array
                      description: Extra Gateway API HTTPRouteFilter objects.
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                identityStrip:
                  type: object
                  description: >
                    Pre-auth identity-header sanitization. kgateway OSS can only
                    mutate headers before extAuth via ListenerPolicy, and that
                    policy must live in the same namespace as the parent Gateway.
                    Cross-namespace gatewayRef skips the ListenerPolicy
                    (status.listenerPolicy=SkippedCrossNamespace) and keeps
                    HTTPRoute strip after auth.
                  properties:
                    manageListenerPolicy:
                      type: boolean
                      default: true
                      description: >
                        When false, operator does not apply ListenerPolicy
                        (bring-your-own earlyRequestHeaderModifier).
                attachments:
                  type: array
                  description: >
                    Opaque same-namespace objects (e.g. kgateway TrafficPolicy)
                    applied with ownerReferences to this Gateway.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                persistence:
                  type: object
                  properties:
                    size:
                      type: string
                      default: 5Gi
                    storageClassName:
                      type: string
                    reclaimPolicy:
                      type: string
                      enum: [Retain, Delete]
                      default: Retain
                gql:
                  type: object
                  properties:
                    maxComplexity:
                      type: integer
                      default: 1000
                    maxDepth:
                      type: integer
                      default: 10
                    gcf:
                      type: boolean
                      default: false
                      description: >
                        vmcp ≥1.3: encode query_graphql tool text as GCF generic
                        profile instead of JSON. Ignored by vmcp 1.2 images.
                proxy:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    path:
                      type: string
                      default: /mcp-proxy
                    gcf:
                      type: boolean
                      default: false
                      description: >
                        vmcp ≥1.3: encode /mcp-proxy tool results as GCF.
                        Independent of gql.gcf. No-op unless proxy.enabled.
                tasks:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    maxConcurrent:
                      type: integer
                      minimum: 1
                      default: 1
                auth:
                  type: object
                  description: >
                    vmcp AuthFacade (≥1.1) and hop-trust knobs (≥1.2). Secrets for
                    master password / tokens / forward-auth hop secret are mounted
                    into the Gateway pod; non-secret settings are rendered to vmcp.toml.
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    provider:
                      type: string
                      enum: [local, authentik]
                      default: local
                    admin:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum: [none, basic, authentik]
                          default: basic
                        requiredGroups:
                          type: array
                          items:
                            type: string
                          description: Exact Authentik groups allowed for /admin when mode=authentik.
                    authentik:
                      type: object
                      description: Required when provider=authentik (and/or admin.mode=authentik).
                      properties:
                        issuer:
                          type: string
                        jwksUrl:
                          type: string
                        audiences:
                          type: array
                          items:
                            type: string
                        acceptBearer:
                          type: boolean
                          default: true
                        forwardAuth:
                          type: boolean
                          default: true
                        usernameHeader:
                          type: string
                          default: x-authentik-username
                        groupsHeader:
                          type: string
                          default: x-authentik-groups
                        groupsClaim:
                          type: string
                          default: groups
                        groupScopes:
                          type: object
                          additionalProperties:
                            type: string
                          description: >
                            Exact Authentik group → space-separated MCP scopes.
                            vmcp ≥1.3 G25 catalog isolation: include
                            `upstream:<name>` so GraphQL/tools/list hide other
                            namespaces (e.g. `mcp:use upstream:dayana`).
                            `mcp:admin` still sees the full catalogue.
                        trustedProxies:
                          type: array
                          items:
                            type: string
                          description: >
                            CIDRs of trusted forward-auth peers (required alone or with
                            forwardAuthSecretRef when forwardAuth=true).
                        forwardAuthSecretRef:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                              minLength: 1
                            key:
                              type: string
                              default: secret
                          description: Shared hop secret injected as VMCP_AUTH__AUTHENTIK__FORWARD_AUTH_SECRET.
                        forwardAuthSecretHeader:
                          type: string
                          default: x-vmcp-forward-auth
                skillRefs:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      key:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                artifactSha256:
                  type: string
                listenerPolicy:
                  type: object
                  description: >
                    Outcome of the optional same-namespace ListenerPolicy for
                    pre-auth identity-header strip (Applied, SkippedCrossNamespace,
                    Disabled).
                  properties:
                    phase:
                      type: string
                    message:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
