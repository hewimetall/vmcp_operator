{{- if .Values.rbac.create }}
{{- range $ns := .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vmcp-operator.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "vmcp-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vmcp-operator.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vmcp-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
