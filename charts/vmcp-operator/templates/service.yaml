{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vmcp-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmcp-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vmcp-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: dashboard
      port: {{ .Values.dashboard.port }}
      targetPort: dashboard
      protocol: TCP
{{- end }}
