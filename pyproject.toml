[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "vmcp-operator"
version = "0.1.0"
description = "Kubernetes operator for multi-instance vmcp gateways"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
dependencies = [
    "aiohttp==3.14.3",
    "httpx==0.28.1",
    "kopf==1.44.6",
    "kr8s==0.20.15",
]

[project.optional-dependencies]
dev = [
    "coverage==7.15.2",
    "maturin>=1.14.1,<2",
    "pytest==9.1.1",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
]

[project.scripts]
vmcp-operator = "vmcp_operator.__main__:main"

[tool.maturin]
manifest-path = "crates/vmcp-op-pyo3/Cargo.toml"
module-name = "vmcp_operator._kernel"
python-source = "python"
features = ["pyo3/abi3t-py315"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["vmcp_operator"]

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
