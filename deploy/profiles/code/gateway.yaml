apiVersion: vmcp.io/v1alpha1
kind: VmcpGateway
metadata:
  name: code
  namespace: team-a
  labels:
    vmcp.io/profile: code
spec:
  image: registry.example.com/ai/vmcp:1.2.0
  adminTokenSecretRef:
    name: code-admin-tokens
  masterPasswordSecretRef:
    name: code-admin-password
    key: password
  publicRoute:
    hostname: code.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
      sectionName: https
  adminRoute:
    hostname: admin-code.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
      sectionName: https
  persistence:
    size: 20Gi
    reclaimPolicy: Retain
  tasks:
    enabled: true
    maxConcurrent: 2
  proxy:
    enabled: true
    path: /mcp-proxy
