apiVersion: vmcp.io/v1alpha1
kind: VmcpGateway
metadata:
  name: other
  namespace: team-a
  labels:
    vmcp.io/profile: other
spec:
  image: registry.example.com/ai/vmcp:1.2.0
  adminTokenSecretRef:
    name: other-admin-tokens
  masterPasswordSecretRef:
    name: other-admin-password
    key: password
  publicRoute:
    hostname: other.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
      sectionName: https
  adminRoute:
    hostname: admin-other.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
      sectionName: https
  persistence:
    size: 10Gi
    reclaimPolicy: Retain
