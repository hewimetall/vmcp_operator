apiVersion: vmcp.io/v1alpha1
kind: VmcpGateway
metadata:
  name: resurche
  namespace: team-a
  labels:
    vmcp.io/profile: resurche
spec:
  image: registry.example.com/ai/vmcp:0.1.0
  adminTokenSecretRef:
    name: resurche-admin-tokens
  masterPasswordSecretRef:
    name: resurche-admin-password
    key: password
  publicRoute:
    hostname: resurche.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
      sectionName: https
  adminRoute:
    hostname: admin-resurche.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
      sectionName: https
  persistence:
    size: 10Gi
    reclaimPolicy: Retain
  tasks:
    enabled: false
  proxy:
    enabled: false
