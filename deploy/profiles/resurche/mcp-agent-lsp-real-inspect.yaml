apiVersion: vmcp.io/v1alpha1
kind: VmcpMcpServer
metadata:
  name: agent-lsp-real-inspect
  namespace: team-a
  labels:
    vmcp.io/profile: resurche
  annotations:
    vmcp.io/blocker: "Provide working RemoteHttp /mcp URL; managed mode needs Docker/bollard runtime"
spec:
  enabled: false
  description: Prefer RemoteHttp to an existing agent-lsp inspect endpoint
  gatewayRef:
    name: resurche
  source:
    type: RemoteHttp
    url: https://agent-lsp.example.com/mcp
