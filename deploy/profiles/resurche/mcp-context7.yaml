apiVersion: vmcp.io/v1alpha1
kind: VmcpMcpServer
metadata:
  name: context7
  namespace: team-a
  labels:
    vmcp.io/profile: resurche
spec:
  enabled: true
  description: Context7 docs lookup (RemoteHttp)
  gatewayRef:
    name: resurche
  source:
    type: RemoteHttp
    url: https://mcp.context7.com/mcp
    bearerSecretRef:
      name: resurche-context7
      key: token
  toolOverrides:
    - name: resolve-library-id
      readOnly: true
      taskSupport: forbidden
    - name: get-library-docs
      readOnly: true
      taskSupport: forbidden
