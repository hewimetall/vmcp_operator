apiVersion: vmcp.io/v1alpha1
kind: VmcpGateway
metadata:
  name: main
  namespace: team-a
spec:
  # Prefer a vmcp ≥1.3 image (G25 catalog + optional GCF). ≥1.2 has AuthFacade.
  image: registry.example.com/ai/vmcp:1.3.0
  adminTokenSecretRef:
    name: main-admin-tokens
  masterPasswordSecretRef:
    name: main-admin-password
    key: password
  publicRoute:
    hostname: main.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
      sectionName: https
  persistence:
    size: 5Gi
    reclaimPolicy: Retain
  tasks:
    enabled: false
  proxy:
    enabled: false
  auth:
    enabled: true
    provider: local
    admin:
      mode: basic
