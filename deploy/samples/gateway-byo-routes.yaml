# Example: operator manages the Gateway Deployment/Service/ConfigMap, but you
# bring your own HTTPRoutes (and optional kgateway TrafficPolicy attachments).
apiVersion: vmcp.io/v1alpha1
kind: VmcpGateway
metadata:
  name: main-byo
  namespace: team-a
spec:
  image: registry.example.com/ai/vmcp:1.2.0
  adminTokenSecretRef:
    name: main-admin-tokens
    writable: true
  masterPasswordSecretRef:
    name: main-admin-password
    key: password
  publicBaseUrl: https://mcp.example.com
  publicRoute:
    hostname: mcp.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
    manage: false
  adminRoute:
    hostname: admin.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
    manage: false
  attachments:
    - apiVersion: gateway.kgateway.dev/v1alpha1
      kind: TrafficPolicy
      metadata:
        name: main-byo-extauth
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: main-byo-admin
