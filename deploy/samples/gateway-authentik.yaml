apiVersion: vmcp.io/v1alpha1
kind: VmcpGateway
metadata:
  name: main-ak
  namespace: team-a
spec:
  image: registry.example.com/ai/vmcp:1.2.0
  adminTokenSecretRef:
    name: main-admin-tokens
    # writable: true   # seed /state/tokens.json once for admin Token CRUD
  masterPasswordSecretRef:
    name: main-admin-password
    key: password
  # Optional override when publicRoute.hostname is not the real public URL.
  # publicBaseUrl: https://mcp.example.com
  publicRoute:
    hostname: main.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
      sectionName: https
    # Default true — strip client-forged Authentik / hop headers at the edge.
    stripClientIdentityHeaders: true
    # manage: false   # BYO HTTPRoute — operator will not apply *-public
  adminRoute:
    hostname: admin-main.example.com
    gatewayRef:
      name: kgateway
      namespace: gateway-system
      sectionName: https
    # Default true — same identity-header strip as public.
    stripClientIdentityHeaders: true
    # Default true when forwardAuthSecretRef is set — inject hop header at edge.
    injectForwardAuthHeader: true
  # attachments:
  #   - apiVersion: gateway.kgateway.dev/v1alpha1
  #     kind: TrafficPolicy
  #     metadata:
  #       name: main-admin-extauth
  #     spec: {}
  auth:
    enabled: true
    provider: authentik
    admin:
      mode: authentik
      requiredGroups:
        - mcp-admins
    authentik:
      issuer: https://auth.example.com/application/o/mcp-internal/
      jwksUrl: https://auth.example.com/application/o/mcp-internal/jwks/
      audiences:
        - https://main.example.com/mcp
      acceptBearer: true
      forwardAuth: true
      # Hop trust (vmcp ≥1.2): required when forwardAuth=true.
      trustedProxies:
        - 10.244.0.0/16
      forwardAuthSecretRef:
        name: main-forward-auth
        key: secret
      groupScopes:
        mcp-users: "mcp:use"
        mcp-admins: "mcp:admin"
