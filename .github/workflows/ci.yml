name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15t"
      - name: Sync and build extension
        run: |
          uv sync --extra dev
          uv run maturin develop
      - name: Pytest coverage gate
        run: uv run pytest --cov=vmcp_operator --cov-report=term-missing
      - name: Ruff
        run: uv run ruff check python tests

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Format / clippy / coverage
        run: |
          cargo fmt --all -- --check
          cargo clippy -p vmcp-op-core -p vmcp-op-pyo3 -- -D warnings
          cargo llvm-cov -p vmcp-op-core --fail-under-lines 93

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - name: Lint and template
        run: |
          set -euo pipefail
          helm lint charts/vmcp-operator
          helm template test charts/vmcp-operator --namespace vmcp-system >/tmp/out.yaml
          # Chart must contain operator Deployment (grep is available on ubuntu-latest).
          grep -n 'app.kubernetes.io/component: operator' /tmp/out.yaml
          grep -n 'ghcr.io/hewimetall/vmcp_operator' /tmp/out.yaml
          if grep -n 'containerPort: 8080' /tmp/out.yaml >/dev/null; then
            echo "operator dashboard port present"
          fi
          test -f charts/vmcp-operator/crds/vmcpgateway.yaml
          test -f charts/vmcp-operator/crds/vmcpmcpserver.yaml
          mkdir -p dist/charts
          helm package charts/vmcp-operator --destination dist/charts
          ls dist/charts/*.tgz

  # Build-only smoke (no push) — same Dockerfile target as release.yml.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: vmcp-operator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Entrypoint is not a no-op
        run: |
          set -euo pipefail
          # Placeholder image used CMD ["true"] and exited 0 with no process.
          entry="$(docker image inspect vmcp-operator:ci --format '{{json .Config.Entrypoint}}')"
          echo "Entrypoint=$entry"
          echo "$entry" | grep -q 'vmcp-operator'
          # Without kubeconfig the process must fail closed (not hang / not silent 0).
          set +e
          timeout 30s docker run --rm --network none vmcp-operator:ci
          code=$?
          set -e
          # 124 = timeout (hung); 0 = old placeholder CMD true.
          test "$code" -ne 0
          test "$code" -ne 124
          echo "runtime entrypoint failed closed with exit=$code (expected)"
